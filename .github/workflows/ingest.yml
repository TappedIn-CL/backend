name: Data Ingestion Script

on:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)
  workflow_dispatch:         # allows manual runs for testing

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi

      - name: Run scrapers
        run: |
          for script in scrapers/*.py; do
            [ "$(basename "$script")" = "__init__.py" ] && continue
            echo "Running $script"
            python "$script"
          done